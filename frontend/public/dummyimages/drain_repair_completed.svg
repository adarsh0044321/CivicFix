<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="waterFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#1e293b"/>

  <!-- Concrete Storm Drain Channel -->
  <polygon points="40,100 560,100 480,360 120,360" fill="#334155" stroke="#64748b" stroke-width="4"/>

  <!-- Clear Flowing Water in Channel -->
  <polygon points="100,220 500,220 470,350 130,350" fill="url(#waterFlow)" fill-opacity="0.75"/>
  <path d="M150 260 Q200 240 250 260 T350 260 T450 260" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M160 290 Q210 270 260 290 T360 290 T460 290" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Clean Galvanized Iron Grate / Silt Catchers on Left/Right -->
  <line x1="80" y1="100" x2="140" y2="360" stroke="#94a3b8" stroke-width="6"/>
  <line x1="520" y1="100" x2="460" y2="360" stroke="#94a3b8" stroke-width="6"/>

  <!-- Verified Badge -->
  <rect x="20" y="20" width="300" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="42" cy="41" r="10" fill="#10b981"/>
  <path d="M37 41 L40 44 L47 37" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="37" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">REPAIR PROOF: DRAIN UNBLOCKED</text>
  <text x="60" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">Solid Silt Cleared • Storm Flow Unimpeded</text>

  <!-- Tag -->
  <rect x="420" y="350" width="160" height="30" rx="6" fill="#0284c7" fill-opacity="0.85"/>
  <text x="500" y="370" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Drainage &amp; Silt Div</text>
</svg>