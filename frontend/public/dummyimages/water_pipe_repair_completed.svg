<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="valveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#0f172a"/>

  <!-- Concrete Utility Pit -->
  <rect x="60" y="80" width="480" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>

  <!-- Heavy Cast-iron Pipe Segment -->
  <rect x="60" y="180" width="480" height="60" fill="url(#pipeGrad)"/>
  <rect x="220" y="170" width="16" height="80" rx="4" fill="#64748b"/>
  <rect x="364" y="170" width="16" height="80" rx="4" fill="#64748b"/>

  <!-- Repaired Valve Flange & Wheel -->
  <rect x="280" y="140" width="40" height="140" rx="6" fill="url(#valveGrad)"/>
  <circle cx="300" cy="130" r="30" fill="none" stroke="#38bdf8" stroke-width="8"/>
  <line x1="300" y1="100" x2="300" y2="160" stroke="#38bdf8" stroke-width="6"/>
  <line x1="270" y1="130" x2="330" y2="130" stroke="#38bdf8" stroke-width="6"/>

  <!-- Pressure Gauge (Normal / Green) -->
  <circle cx="430" cy="150" r="24" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <path d="M415 155 A15 15 0 0 1 445 155" fill="none" stroke="#22c55e" stroke-width="4"/>
  <line x1="430" y1="150" x2="438" y2="140" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="430" cy="150" r="3" fill="#1e293b"/>

  <!-- Verified Badge -->
  <rect x="20" y="20" width="290" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="42" cy="41" r="10" fill="#10b981"/>
  <path d="M37 41 L40 44 L47 37" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="37" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">REPAIR PROOF: PIPE REPLACED</text>
  <text x="60" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">Ductile Iron Flange Fitted • Leak Test 0 PSI</text>

  <!-- Tag -->
  <rect x="420" y="350" width="160" height="30" rx="6" fill="#0284c7" fill-opacity="0.85"/>
  <text x="500" y="370" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Water Works Div</text>
</svg>