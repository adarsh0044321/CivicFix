<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="asphaltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="patchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background / Sky -->
  <rect width="600" height="180" fill="url(#skyGrad)"/>

  <!-- Road Horizon Line & Road Surface -->
  <polygon points="0,400 600,400 380,180 220,180" fill="url(#asphaltGrad)"/>

  <!-- Kerbs / Pavement Borders -->
  <polygon points="0,400 60,400 230,180 220,180" fill="#64748b"/>
  <polygon points="540,400 600,400 380,180 370,180" fill="#64748b"/>

  <!-- Fresh Bitumen Repair Patch Area -->
  <polygon points="170,360 430,360 350,230 250,230" fill="url(#patchGrad)" stroke="#0d9488" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Roller Compaction Texture Lines -->
  <line x1="200" y1="330" x2="400" y2="330" stroke="#334155" stroke-width="3"/>
  <line x1="220" y1="300" x2="380" y2="300" stroke="#334155" stroke-width="3"/>
  <line x1="240" y1="270" x2="360" y2="270" stroke="#334155" stroke-width="2.5"/>

  <!-- Center Road Dividing Stripe (Fresh White Paint) -->
  <polygon points="295,400 305,400 302,320 298,320" fill="#f8fafc"/>
  <polygon points="298,300 302,300 301,240 299,240" fill="#f8fafc"/>
  <polygon points="299,230 301,230 300,190 300,190" fill="#f8fafc"/>

  <!-- Verified Seal Badge -->
  <rect x="20" y="20" width="280" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="42" cy="41" r="10" fill="#10b981"/>
  <path d="M37 41 L40 44 L47 37" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="37" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">REPAIR PROOF: FRESH BITUMEN</text>
  <text x="60" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">Hot-mix Asphalt Compacted &amp; Leveled</text>

  <!-- Watermark Tag -->
  <rect x="420" y="350" width="160" height="30" rx="6" fill="#0284c7" fill-opacity="0.85"/>
  <text x="500" y="370" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">BMC Road Division</text>
</svg>