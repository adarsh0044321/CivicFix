<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="240" fill="#334155"/>
  <rect x="0" y="240" width="600" height="160" fill="#475569"/>

  <!-- Clean Paver Tile Lines -->
  <line x1="0" y1="300" x2="600" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="240" x2="150" y2="400" stroke="#64748b" stroke-width="2"/>
  <line x1="300" y1="240" x2="300" y2="400" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="240" x2="450" y2="400" stroke="#64748b" stroke-width="2"/>

  <!-- Clean Green BMC Compactor Waste Bins -->
  <rect x="220" y="160" width="160" height="130" rx="8" fill="#15803d" stroke="#166534" stroke-width="3"/>
  <rect x="210" y="150" width="180" height="18" rx="6" fill="#166534"/>
  <circle cx="250" cy="290" r="14" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
  <circle cx="350" cy="290" r="14" fill="#0f172a" stroke="#64748b" stroke-width="4"/>

  <!-- Recycling / Clean Emblem -->
  <text x="300" y="225" font-family="system-ui, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">♻️</text>
  <text x="300" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">BMC SWACHH BIN</text>

  <!-- Verified Badge -->
  <rect x="20" y="20" width="300" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="42" cy="41" r="10" fill="#10b981"/>
  <path d="M37 41 L40 44 L47 37" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="37" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">REPAIR PROOF: DUMP CLEARED</text>
  <text x="60" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">Garbage Evacuated • Bleach Sanitized</text>

  <!-- Tag -->
  <rect x="420" y="350" width="160" height="30" rx="6" fill="#0284c7" fill-opacity="0.85"/>
  <text x="500" y="370" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Swachh Sanitation</text>
</svg>