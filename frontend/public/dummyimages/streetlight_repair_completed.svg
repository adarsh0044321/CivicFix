<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="lightBeam" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night Sky -->
  <rect width="600" height="400" fill="#090d16"/>

  <!-- Light Beam Illumination Cone -->
  <polygon points="300,100 80,400 520,400" fill="url(#lightBeam)"/>

  <!-- Road Surface Under Light -->
  <rect x="0" y="320" width="600" height="80" fill="#1e293b"/>
  <line x1="0" y1="360" x2="600" y2="360" stroke="#facc15" stroke-width="3" stroke-dasharray="24,16"/>

  <!-- Streetlight Pole & Fixture -->
  <line x1="300" y1="100" x2="300" y2="360" stroke="#94a3b8" stroke-width="8"/>
  <path d="M300 130 Q300 80 340 70 L350 70" fill="none" stroke="#94a3b8" stroke-width="7"/>
  <ellipse cx="345" cy="74" rx="20" ry="7" fill="#f8fafc"/>
  <circle cx="345" cy="74" r="14" fill="#fef08a" filter="drop-shadow(0 0 8px #fef08a)"/>

  <!-- Verified Badge -->
  <rect x="20" y="20" width="300" height="42" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="42" cy="41" r="10" fill="#10b981"/>
  <path d="M37 41 L40 44 L47 37" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="37" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">REPAIR PROOF: 120W LED RESTORED</text>
  <text x="60" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">Phase Conductor Replaced • Junction Lit</text>

  <!-- Tag -->
  <rect x="420" y="350" width="160" height="30" rx="6" fill="#0284c7" fill-opacity="0.85"/>
  <text x="500" y="370" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Electrical Fleet</text>
</svg>